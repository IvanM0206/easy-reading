<title>Foco de lectura</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Literata:opsz,wght@7..72,400;7..72,600&display=swap">
<style>
  /* Layout: columna de lectura de ~65ch; barra fija con los controles de uso; panel de ajustes en el flujo; velo de enfoque fijo sobre el viewport */
  :root {
    --bg: #F2F5F6;
    --fg: #17212B;
    --muted: #5A6772;
    --line: #D5DDE2;
    --ctl: #E7EDF0;
    --accent: #0B7A75;
    --accent-fg: #FFFFFF;
    --font-ui: "Atkinson Hyperlegible", system-ui, sans-serif;
    --font-read: "Literata", Georgia, serif;
    --fs: 20px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #10171C; --fg: #DCE4EA; --muted: #93A1AC; --line: #2A3640;
      --ctl: #1A242B; --accent: #4CC9BE; --accent-fg: #08201E; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #10171C; --fg: #DCE4EA; --muted: #93A1AC; --line: #2A3640;
    --ctl: #1A242B; --accent: #4CC9BE; --accent-fg: #08201E; color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 16px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 0 64px;
  }
  body::before {
    content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
    background: var(--bg); z-index: 30;
  }
  button, input, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .bar {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
    background: var(--bg); border-bottom: 1px solid var(--line);
    margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))) calc(-1 * max(16px, env(safe-area-inset-right, 0px)));
    padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px));
  }
  .bar-in {
    max-width: 720px; margin: 0 auto; padding-block: 10px;
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px;
  }
  .brand { font-weight: 700; font-size: 1rem; letter-spacing: .01em; margin-right: auto; }
  .seg { display: inline-flex; background: var(--ctl); border-radius: 8px; padding: 3px; gap: 2px; }
  .seg button {
    border: 0; background: transparent; padding: 6px 12px; border-radius: 6px; cursor: pointer;
    font-size: .9rem; color: var(--muted);
  }
  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); font-weight: 700; }
  .switch {
    display: inline-flex; align-items: center; gap: 8px; border: 0; background: transparent;
    cursor: pointer; padding: 4px 2px; font-size: .9rem;
  }
  .switch i {
    width: 38px; height: 22px; border-radius: 11px; background: var(--line); position: relative;
    transition: background .15s;
  }
  .switch i::after {
    content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%;
    background: var(--bg); transition: transform .15s;
  }
  .switch[aria-checked="true"] i { background: var(--accent); }
  .switch[aria-checked="true"] i::after { transform: translateX(16px); }

  .wrap { max-width: 720px; margin: 0 auto; padding-top: 20px; }

  .panel { border: 1px solid var(--line); border-radius: 10px; padding: 0 16px; margin-bottom: 32px; }
  .panel summary { cursor: pointer; padding: 12px 0; font-weight: 700; }
  .panel-body { padding-bottom: 16px; display: grid; gap: 14px 24px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
  .field { display: grid; gap: 4px; min-width: 0; }
  .field label { display: flex; justify-content: space-between; font-size: .9rem; color: var(--muted); }
  .field output { font-variant-numeric: tabular-nums; color: var(--fg); }
  input[type="range"] { width: 100%; accent-color: var(--accent); }
  .field[hidden] { display: none; }
  .play {
    border: 1px solid var(--accent); background: transparent; color: var(--accent);
    border-radius: 8px; padding: 7px 12px; cursor: pointer; justify-self: start;
  }
  .play[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }
  .own { grid-column: 1 / -1; }
  .own textarea {
    width: 100%; min-height: 96px; resize: vertical; background: var(--ctl); border: 1px solid var(--line);
    border-radius: 8px; padding: 10px; font-size: .9rem;
  }
  .own .row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .own button {
    border: 1px solid var(--line); background: var(--ctl); border-radius: 8px; padding: 7px 12px; cursor: pointer;
  }
  .own button.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }

  .text { font-family: var(--font-read); font-size: var(--fs); line-height: 1.75; max-width: 65ch; margin: 0 auto; }
  .text p { margin: 0 0 1.75em; }
  .text p:last-child { margin-bottom: 0; }
  .hint { max-width: 65ch; margin: 40px auto 0; color: var(--muted); font-size: .9rem; line-height: 1.5; }
  .hint kbd { border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; background: var(--ctl); font-family: inherit; }

  #veil { position: fixed; inset: 0; z-index: 10; pointer-events: none; }
  #veil.blur { backdrop-filter: blur(var(--b, 8px)); -webkit-backdrop-filter: blur(var(--b, 8px)); }
  #veil.dim { background: var(--bg); opacity: var(--o, .7); }
  #veil[hidden] { display: none; }
</style>

<header class="bar">
  <div class="bar-in">
    <strong class="brand">Foco de lectura</strong>
    <div class="seg" role="group" aria-label="Qué sigue el foco">
      <button type="button" data-mode="cursor" aria-pressed="true">Cursor</button>
      <button type="button" data-mode="line" aria-pressed="false">Línea</button>
    </div>
    <div class="seg" role="group" aria-label="Efecto">
      <button type="button" data-effect="blur" aria-pressed="true">Desenfoque</button>
      <button type="button" data-effect="dim" aria-pressed="false">Resaltado</button>
    </div>
    <button type="button" class="switch" id="onoff" role="switch" aria-checked="true"><i></i>Enfoque</button>
  </div>
</header>

<main class="wrap">
  <details class="panel" open>
    <summary>Ajustes</summary>
    <div class="panel-body">
      <div class="field">
        <label for="zone">Tamaño de la zona nítida <output id="zoneO"></output></label>
        <input id="zone" type="range" min="1" max="10" step="1">
      </div>
      <div class="field">
        <label for="strength">Intensidad del efecto <output id="strengthO"></output></label>
        <input id="strength" type="range" min="1" max="10" step="1">
      </div>
      <div class="field">
        <label for="fs">Tamaño de letra <output id="fsO"></output></label>
        <input id="fs" type="range" min="16" max="30" step="1">
      </div>
      <div class="field" id="speedField" hidden>
        <label for="spd">Segundos por línea <output id="spdO"></output></label>
        <input id="spd" type="range" min="0.5" max="8" step="0.5">
        <button type="button" class="play" id="play" aria-pressed="false">Avanzar solo</button>
      </div>
      <div class="field own">
        <label for="mytext">Tu propio texto</label>
        <textarea id="mytext" spellcheck="false" placeholder="Pegá acá lo que quieras leer. Separá los párrafos con una línea en blanco."></textarea>
        <div class="row">
          <button type="button" class="primary" id="useText">Usar este texto</button>
          <button type="button" id="resetText">Volver al ejemplo</button>
        </div>
      </div>
    </div>
  </details>

  <article class="text" id="reader" lang="es"></article>

  <p class="hint" id="hint"></p>
</main>

<div id="veil" aria-hidden="true"></div>

<script>
(function () {
  var SAMPLE = [
    "En un lugar de la Mancha, de cuyo nombre no quiero acordarme, no ha mucho tiempo que vivía un hidalgo de los de lanza en astillero, adarga antigua, rocín flaco y galgo corredor. Una olla de algo más vaca que carnero, salpicón las más noches, duelos y quebrantos los sábados, lentejas los viernes, algún palomino de añadidura los domingos, consumían las tres partes de su hacienda. El resto della concluían sayo de velarte, calzas de velludo para las fiestas con sus pantuflos de lo mesmo, y los días de entresemana se honraba con su vellori de lo más fino.",
    "Tenía en su casa una ama que pasaba de los cuarenta, y una sobrina que no llegaba a los veinte, y un mozo de campo y plaza, que así ensillaba el rocín como tomaba la podadera. Frisaba la edad de nuestro hidalgo con los cincuenta años; era de complexión recia, seco de carnes, enjuto de rostro, gran madrugador y amigo de la caza.",
    "Es, pues, de saber, que este sobredicho hidalgo, los ratos que estaba ocioso, que eran los más del año, se daba a leer libros de caballerías, con tanta afición y gusto, que olvidó casi de todo punto el ejercicio de la caza, y aun la administración de su hacienda. Y llegó a tanto su curiosidad y desatino en esto, que vendió muchas hanegas de tierra de sembradura para comprar libros de caballerías en que leer, y así llevó a su casa todos cuantos pudo haber dellos.",
    "En resolución, él se enfrascó tanto en su lectura, que se le pasaban las noches leyendo de claro en claro, y los días de turbio en turbio; y así, del poco dormir y del mucho leer, se le secó el celebro de manera que vino a perder el juicio."
  ].join("\n\n");

  var $ = function (id) { return document.getElementById(id); };
  var veil = $("veil"), reader = $("reader"), panelSpeed = $("speedField");
  var coarse = window.matchMedia("(pointer: coarse)").matches;
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  var S = { mode: coarse ? "line" : "cursor", effect: "blur", on: true, zone: 4, strength: 6, fs: 20, spd: 3, line: 0, playing: false, text: SAMPLE };
  try {
    var saved = JSON.parse(localStorage.getItem("foco-lectura") || "{}");
    ["mode", "effect", "on", "zone", "strength", "fs", "spd"].forEach(function (k) { if (saved[k] !== undefined) S[k] = saved[k]; });
  } catch (e) {}
  function save() {
    try {
      localStorage.setItem("foco-lectura", JSON.stringify({ mode: S.mode, effect: S.effect, on: S.on, zone: S.zone, strength: S.strength, fs: S.fs, spd: S.spd }));
    } catch (e) {}
  }

  /* Posición del puntero (en coordenadas del viewport). Arranca a media altura para que el efecto se vea antes de mover el mouse. */
  var px = window.innerWidth / 2, py = window.innerHeight * 0.45;
  var cx = px, cy = py, raf = 0;
  var lh = 35, lines = 1;

  function renderText() {
    reader.textContent = "";
    S.text.split(/\n\s*\n/).forEach(function (chunk) {
      var t = chunk.replace(/\s+/g, " ").trim();
      if (!t) return;
      var p = document.createElement("p");
      p.textContent = t;
      reader.appendChild(p);
    });
    measure();
  }

  function measure() {
    var cs = getComputedStyle(reader);
    lh = parseFloat(cs.lineHeight) || S.fs * 1.75;
    lines = Math.max(1, Math.round(reader.offsetHeight / lh));
    if (S.line > lines - 1) S.line = lines - 1;
    kick();
  }

  function lineY() { return reader.getBoundingClientRect().top + (S.line + 0.5) * lh; }

  function frame() {
    raf = 0;
    var tx, ty;
    if (S.mode === "cursor") { tx = px; ty = py; }
    else { tx = window.innerWidth / 2; ty = lineY(); }
    var k = reduce ? 1 : 0.28;
    cx += (tx - cx) * k; cy += (ty - cy) * k;
    var moving = Math.abs(tx - cx) > 0.4 || Math.abs(ty - cy) > 0.4;
    if (!moving) { cx = tx; cy = ty; }

    var mask;
    if (S.mode === "cursor") {
      var r = 50 + S.zone * 20, f = r * 0.7;
      mask = "radial-gradient(circle at " + cx + "px " + cy + "px, transparent " + r + "px, #000 " + (r + f) + "px)";
    } else {
      var h = lh * (0.6 + S.zone * 0.15), g = lh * 1.6;
      mask = "linear-gradient(to bottom, #000 " + (cy - h - g) + "px, transparent " + (cy - h) + "px, transparent " + (cy + h) + "px, #000 " + (cy + h + g) + "px)";
    }
    veil.style.webkitMaskImage = mask;
    veil.style.maskImage = mask;
    if (moving) kick();
  }
  function kick() { if (!raf) raf = requestAnimationFrame(frame); }

  function applyEffect() {
    veil.className = S.effect;
    veil.style.setProperty("--b", (S.strength * 1.6) + "px");
    veil.style.setProperty("--o", (0.15 + S.strength * 0.085).toFixed(2));
    veil.hidden = !S.on;
  }

  function applyUI() {
    document.querySelectorAll("[data-mode]").forEach(function (b) { b.setAttribute("aria-pressed", String(b.dataset.mode === S.mode)); });
    document.querySelectorAll("[data-effect]").forEach(function (b) { b.setAttribute("aria-pressed", String(b.dataset.effect === S.effect)); });
    $("onoff").setAttribute("aria-checked", String(S.on));
    panelSpeed.hidden = S.mode !== "line";
    $("zone").value = S.zone; $("zoneO").textContent = S.zone;
    $("strength").value = S.strength; $("strengthO").textContent = S.strength;
    $("fs").value = S.fs; $("fsO").textContent = S.fs + " px";
    $("spd").value = S.spd; $("spdO").textContent = S.spd + " s";
    document.documentElement.style.setProperty("--fs", S.fs + "px");
    $("hint").innerHTML = S.mode === "cursor"
      ? "Mové el cursor sobre el texto. La zona nítida te sigue y el resto queda " + (S.effect === "blur" ? "desenfocado" : "atenuado") + ". Si leés sin mover el mouse, probá el modo Línea."
      : "Usá <kbd>↑</kbd> <kbd>↓</kbd> para cambiar de línea, tocá una línea para saltar a ella o <kbd>Espacio</kbd> para avanzar solo.";
    applyEffect();
    measure();
  }

  /* Eventos */
  window.addEventListener("pointermove", function (e) { px = e.clientX; py = e.clientY; if (S.mode === "cursor") kick(); }, { passive: true });
  window.addEventListener("scroll", kick, { passive: true });
  window.addEventListener("resize", measure);

  reader.addEventListener("click", function (e) {
    if (S.mode !== "line") return;
    var top = reader.getBoundingClientRect().top;
    setLine(Math.floor((e.clientY - top) / lh), false);
  });

  document.querySelectorAll("[data-mode]").forEach(function (b) {
    b.addEventListener("click", function () { S.mode = b.dataset.mode; stop(); save(); applyUI(); });
  });
  document.querySelectorAll("[data-effect]").forEach(function (b) {
    b.addEventListener("click", function () { S.effect = b.dataset.effect; save(); applyUI(); });
  });
  $("onoff").addEventListener("click", function () { S.on = !S.on; save(); applyUI(); });
  [["zone", "zone"], ["strength", "strength"], ["fs", "fs"], ["spd", "spd"]].forEach(function (p) {
    $(p[0]).addEventListener("input", function (e) { S[p[1]] = parseFloat(e.target.value); save(); applyUI(); });
  });

  /* Modo línea: avance manual y automático */
  var timer = 0;
  function setLine(n, scroll) {
    S.line = Math.max(0, Math.min(lines - 1, n));
    if (scroll !== false) {
      var y = lineY();
      if (y > window.innerHeight * 0.68 || y < $("onoff").getBoundingClientRect().bottom + 60) {
        window.scrollBy({ top: y - window.innerHeight * 0.4, behavior: reduce ? "auto" : "smooth" });
      }
    }
    kick();
  }
  function stop() {
    S.playing = false; clearInterval(timer); timer = 0;
    $("play").setAttribute("aria-pressed", "false"); $("play").textContent = "Avanzar solo";
  }
  function start() {
    S.playing = true;
    $("play").setAttribute("aria-pressed", "true"); $("play").textContent = "Pausar";
    clearInterval(timer);
    timer = setInterval(function () {
      if (S.line >= lines - 1) { stop(); return; }
      setLine(S.line + 1);
    }, S.spd * 1000);
  }
  $("play").addEventListener("click", function () { S.playing ? stop() : start(); });
  $("spd").addEventListener("change", function () { if (S.playing) start(); });

  document.addEventListener("keydown", function (e) {
    var tag = (e.target.tagName || "").toLowerCase();
    if (tag === "textarea" || tag === "input") return;
    if (e.key === "f" || e.key === "F") { S.on = !S.on; save(); applyUI(); return; }
    if (S.mode !== "line") return;
    if (e.key === "ArrowDown") { e.preventDefault(); setLine(S.line + 1); }
    else if (e.key === "ArrowUp") { e.preventDefault(); setLine(S.line - 1); }
    else if (e.key === " " && tag !== "button") { e.preventDefault(); S.playing ? stop() : start(); }
  });

  /* Texto propio */
  $("useText").addEventListener("click", function () {
    var v = $("mytext").value.trim();
    if (!v) return;
    S.text = v; S.line = 0; stop(); renderText(); window.scrollTo({ top: 0 });
  });
  $("resetText").addEventListener("click", function () {
    S.text = SAMPLE; S.line = 0; stop(); $("mytext").value = ""; renderText();
  });

  renderText();
  applyUI();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(measure);
})();
</script>
